[General]
network = artery.envmod.World

cmdenv-express-mode = false
cmdenv-autoflush = false
debug-on-errors = true
print-undisposed = true
**.cmdenv-log-level = info
cmdenv-redirect-output = true

**.scalar-recording = true
**.vector-recording = true
**.wlan[*].**.statistic-recording = true

**.transmission.result-recording-modes = +vector(camStationId)
**.reception.result-recording-modes = +vector(camStationId)

warmup-period = 30s
*.traci.core.startTime = 25s
*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.seed = 23423
*.traci.launcher.sumocfg = "first.sumocfg"
*.traci.launcher.sumo = "sumo-gui"
*.traci.nodes.typename = "InsertionDelayNodeManager"
*.traci.mapper.typename = "traci.MultiTypeModuleMapper"
*.traci.mapper.vehicleTypes = xmldoc("vehicles.xml")
*.traci.nodes.destroyVehiclesOnCrash = true


*.withPhysicalEnvironment = true
*.physicalEnvironment.groundType = "FlatGround"

*.radioMedium.pathLossType = "Gemv2"
*.radioMedium.pathLoss.withSmallScaleVariations = false

**.identityRegistryModule = "idRegistry"

*.node[*].numRadios = 1
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.node[*].middleware.datetime = "2018-03-19 10:00:00"
*.node[*].middleware.services = xmldoc("services.xml")
*.node[0].pcapRecorder.outputFile = "car1.pcapng"
*.node[1].pcapRecorder.outputFile = "car2.pcapng"


*.node[1].middleware.CA.isZombie = true
*.node[2].middleware.CA.isZombie = true
*.node[3].middleware.CA.isZombie = true
*.node[4].middleware.CA.isZombie = true
*.node[5].middleware.CA.isZombie = true
*.node[6].middleware.CA.isZombie = true
*.node[7].middleware.CA.isZombie = true
*.node[8].middleware.CA.isZombie = true
*.node[9].middleware.CA.isZombie = true
*.node[10].middleware.CA.isZombie = true
*.node[11].middleware.CA.isZombie = true
*.node[12].middleware.CA.isZombie = true
*.node[13].middleware.CA.isZombie = true
*.node[14].middleware.CA.isZombie = true
*.node[15].middleware.CA.isZombie = true
*.node[16].middleware.CA.isZombie = true
*.node[17].middleware.CA.isZombie = true
*.node[18].middleware.CA.isZombie = true
*.node[19].middleware.CA.isZombie = true
*.node[20].middleware.CA.isZombie = true

*.node[*].wlan[*].mac.hcf.maxQueueSize = 1

[Config no_gui]
*.traci.launcher.sumo = "sumo"
